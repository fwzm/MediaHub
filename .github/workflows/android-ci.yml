name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify wrapper permissions
        run: chmod +x ./gradlew

      - name: Assemble, test, and lint
        run: ./gradlew --stacktrace assembleDebug testDebugUnitTest lintDebug
