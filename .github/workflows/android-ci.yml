name: Android CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # required check 名保持 "build"（main branch protection 按 context "build" 校验）。
  # 拆分 jobs 前必须先同步修改 branch protection rule。
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Phase CI-H1：测试挂死（无 failure 的 advanceUntilIdle 死锁等）不再吃满 job
      # timeout——15 分钟强杀使本 step 失败；Lint 带 always() 继续执行不被吞掉
      - name: Unit tests
        timeout-minutes: 15
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        if: always()
        timeout-minutes: 15
        run: ./gradlew lintDebug --no-daemon
