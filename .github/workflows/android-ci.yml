name: Android CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # required check 名保持 "build"（main branch protection 按 context "build" 校验）。
  # 拆分 jobs 前必须先同步修改 branch protection rule。
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        # Phase CI-H1 评审裁定：刻意停在 v5——v6 默认 cache-provider 切换为
        # proprietary 的 enhanced caching（非纯 OSS）。Node-24 迁移只需 v5；
        # 若未来显式接受 enhanced caching/Terms 再单独升级，不夹带在 runtime hardening 里
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Phase CI-H1：测试挂死（无 failure 的 advanceUntilIdle 死锁等）不再吃满 job
      # timeout——15 分钟强杀使本 step 失败；Lint 用 !cancelled()——
      # 测试 FAIL/TIMEOUT 时仍执行，workflow 被 concurrency 取消时不执行
      - name: Unit tests
        timeout-minutes: 15
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: ./gradlew lintDebug --no-daemon
