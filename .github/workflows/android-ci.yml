name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # pull_request 默认签出合并 ref；产品验收必须测试真正的 PR head。
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # required check 名保持 "build"（main branch protection 按 context "build" 校验）。
  # 新增仪器测试通过 needs + 显式断言汇入 build，不改变 branch protection context。
  build:
    needs: visual-instrumentation
    # 即使仪器测试失败也保留原来的 build/unit/lint 诊断，最后再断言总门禁。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p ci-evidence
          printf 'head=%s\nbase=%s\nevent_sha=%s\n' "$EXPECTED_HEAD" "$PR_BASE" "$GITHUB_SHA" | tee ci-evidence/revision.txt

      - name: Record validation revision
        run: |
          mkdir -p ci-validation
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          pr = event.get('pull_request', {})
          revision = {
              'checkoutSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'eventSha': os.environ['GITHUB_SHA'],
              'headSha': pr.get('head', {}).get('sha'),
              'baseSha': pr.get('base', {}).get('sha'),
              'runId': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
          }
          pathlib.Path('ci-validation/revision.json').write_text(json.dumps(revision, indent=2) + '\n')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        # Phase CI-H1 评审裁定：刻意停在 v5——v6 默认 cache-provider 切换为
        # proprietary 的 enhanced caching（非纯 OSS）。Node-24 迁移只需 v5；
        # 若未来显式接受 enhanced caching/Terms 再单独升级，不夹带在 runtime hardening 里
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        # 2026-09 runner SDK 仓库已无 'tools' 包；action 默认 packages 含 'tools' 会
        # 以 warning 失败（run 35622300389 证据：Failed to find package 'tools'）。
        # 显式只装 platform-tools；平台/构建工具由下方 sdkmanager 步骤安装。
        with:
          packages: platform-tools

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Validate emulator preparation guards
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_prepare_visual_emulator.py' -v

      # Phase CI-H1：测试挂死（无 failure 的 advanceUntilIdle 死锁等）不再吃满 job
      # timeout——15 分钟强杀使本 step 失败；Lint 用 !cancelled()——
      # 测试 FAIL/TIMEOUT 时仍执行，workflow 被 concurrency 取消时不执行
      - name: Remove reports from earlier unit executions
        run: |
          python3 .github/scripts/verify-unit-tests.py --clean
          python3 .github/scripts/verify-unit-tests.py --begin --report-timezone UTC --sha "$EXPECTED_HEAD" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

      - name: Unit tests
        timeout-minutes: 15
        # testDebugUnitTest 不会运行独立 Kotlin/JVM 模块的 test task。
        run: ./gradlew testDebugUnitTest :core:model:test :provider:api:test :metadata:test --no-daemon --continue --rerun-tasks --no-build-cache

      - name: Require fresh unit test evidence
        if: ${{ !cancelled() }}
        run: |
          python3 .github/scripts/verify-unit-tests.py --record --sha "$EXPECTED_HEAD" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          # 每个 required-suite 参数的语义是"这个套件必须真的执行过"。理由同 windows-ci 的
          # WebDav 教训：套件整体消失时 gradle 仍会打印 BUILD SUCCESSFUL，
          # 只有把跨端契约/互操作套件按名字钉住才能发现"测试还在文件里却没跑"。
          #   pairing.*   —— 与 Windows 的配对载荷字节级互操作（黄金向量由真 API 生成）
          #   sync.*      —— 与 Windows 的来源同步信封/规划器三桶口径
          #   Migration4to5 —— servers 表加同步身份三列的迁移（真机开库前的唯一守卫）
          #   UpNextResolver / PlayerAutoplay —— 跨季连播解析与 Ended 事件接线
          #   pairing.PairingTransportClient / ...EndToEnd —— 只拨回环的 4 字节帧收发（W6-G）
          #   feature.settings.sync.* —— 导入四桶分桶/失败关闭（W6-F 逻辑+会话）与补录验证协调器（W6-H）
          #   pairing.* / AndroidSourceSyncSecurityTest —— 对抗性输入回归（W6-J：畸形载荷/帧、非回环拒绝、
          #     凭据不回显、坏信封零写入、重复 syncSourceId 整封拒绝=W6J-1）
          #   sync.SourceSyncTransfer* —— 分块帧传输与 Windows 逐字节互操作（W6-22：向量由真 API 生成，
          #     19 条错误流的 reason 与 Windows 同名同序；收满即返、尾随帧不读）
          #   sync.SourceSyncTransferAuthTest —— 传输对端认证（W6-25：五码 + 33 字节 tag 帧 0x03 +
          #     HMAC-SHA256 over nonce‖envelope，金标向量由 Windows 实现生成；关闭认证时与 W6-22 向量全等）
          #   sync.SourceSyncTlsTest —— TLS 1.3 + SPKI 指纹钉扎（W6-29：只协商 1.3、pin=SHA-256(publicKey.encoded)、
          #     四码与 Windows 同名同序、接收端 5 字节嗅探、graceful close；夹具与期望指纹由 Windows 权威实现生成）
          #   sync.SourceSyncTransferListenerTest —— 回环监听端（W6-34：只绑回环、端口 0 取实际值、单连接串行、
          #     复用 SourceSyncTransfer.receive 解帧，TLS 走 handshakeServer / 明文走 5 字节嗅探，关闭 TLS 走 graceful close）
          #   sync.SourceSyncDeliveryTest —— 发送端投递确认（W6-46：单码 delivery-unconfirmed 独立封闭集、
          #     写完最后一帧后读对端直到 FIN，预算 2000 ms、最多排水 64 KiB，回执优先；Off 时不读一个字节）
          #   feature.settings.sync.SourceSyncSendLauncherTest —— 发送取消的 Job 记账薄壳（W6-49：取消回 Idle
          #     不产生失败码、释放单飞可立刻重发、没在发时 cancel 是 no-op、clear 后状态仍可用）
          #   sync.SourceSyncReceiptTest —— 反向回执帧 0x04（W6-40：四码与 Windows 同名同序、回执只在信封解码成功后写、
          #     没开回执的监听端一个字节都不发）
          #   sync.SourceSyncHostAddressTest —— 监听卡绑定地址判定（W6-52：四类拒绝句、自己算 IPv4 字面量永不查 DNS、
          #     只放行一个单播地址、建 socket 之前就拒）
          #   feature.settings.sync.SourceSyncListenerControllerTest —— 监听卡控制器（W6-36 起；W6-52 地址、W6-53 对端
          #     口令、W6-54 等待预算三段都在这里，界面本地码 listen-secret-missing / listen-budget-invalid 各有用例）
          #   sync.SourceSyncTransferClientHostTest —— 拨号侧地址判定（W6-52b：sendTo / receiveFrom 的 allowExplicitHost
          #     与 verb 参数，开关关着时拒绝句与 W6-23 逐字相同；通配/广播/组播/主机名在拨号之前就拒，本机不真拨非回环）
          #   sync.SourceSyncTransferMatrixTest —— 真实回环 socket 上的四维组合矩阵（W6-57：TLS × 认证 × 回执 × 投递
          #     20 格逐格钉住外部可观察结果与稳定码；认证格同时宣布挑战，回执压掉投递，只碰 127.0.0.1）
          #   sync.SourceSyncTransferCancelTest —— 本地取消把手（W6-58：取消关连接让阻塞读立刻返回，
          #     结果是本地码 transfer-cancelled 而非 io-failed；只覆盖失败结果，成功收下的信封不被晚到的取消抹掉）
          #   feature.settings.sync.SourceSyncReceiveLauncherTest —— 接收卡的单飞与取消（W6-58：取消回 Idle 不留码、
          #     未在收时是 no-op、每次启动一枚新把手，旧取消不泄漏到下一次接收）
          #   feature.settings.pairing.PairingLinkControllerTest —— 配对链接核对（W6-59：合法链接解出设备 / 指纹 /
          #     剩余秒，非法链接原样透出 core:common 的码（code-empty / not-a-pairing-link / code-too-long /
          #     not-base64url / payload-invalid / expired），核对成功也不泄露挑战，失败作废上一次结论）
          python3 .github/scripts/verify-unit-tests.py --sha "$EXPECTED_HEAD" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --required-suite com.mediahub.provider.emby.progress.SlowFinalExitRegressionTest \
            --required-suite com.mediahub.feature.settings.backup.RestoreSnapshotStoreTest \
            --required-suite com.mediahub.app.WebDavJointChainTest \
            --required-suite com.mediahub.player.mpv.MpvSubtitleTest \
            --required-suite com.mediahub.core.database.repository.ServerRepositorySubtitleIdentityTest \
            --required-suite com.mediahub.feature.player.PlayerViewModelSubtitleCenterTest \
            --required-suite com.mediahub.player.engine.PlaybackEngineExternalSubtitleTest \
            --required-suite com.mediahub.provider.webdav.WebDavParserPlatformCompatibilityTest \
            --required-suite com.mediahub.core.common.pairing.PairingVectorsTest \
            --required-suite com.mediahub.core.common.pairing.PairingFrameTest \
            --required-suite com.mediahub.core.common.sync.WindowsGoldenInteropTest \
            --required-suite com.mediahub.core.common.sync.SourceSyncPlannerTest \
            --required-suite com.mediahub.core.database.sync.AndroidSourceSyncServiceTest \
            --required-suite com.mediahub.core.database.Migration4to5Test \
            --required-suite com.mediahub.model.UpNextResolverTest \
            --required-suite com.mediahub.feature.player.PlayerAutoplayTest \
            --required-suite com.mediahub.core.common.pairing.PairingTransportClientTest \
            --required-suite com.mediahub.core.common.pairing.PairingTransportEndToEndTest \
            --required-suite com.mediahub.feature.settings.sync.SourceSyncImportLogicTest \
            --required-suite com.mediahub.feature.settings.sync.SourceSyncImportSessionTest \
            --required-suite com.mediahub.feature.settings.sync.SourceVerificationCoordinatorTest \
            --required-suite com.mediahub.core.common.pairing.PairingMaliciousInputTest \
            --required-suite com.mediahub.core.common.pairing.PairingTransportSecurityTest \
            --required-suite com.mediahub.core.common.pairing.PairingCredentialLeakTest \
            --required-suite com.mediahub.core.database.sync.AndroidSourceSyncSecurityTest \
            --required-suite com.mediahub.core.common.sync.SourceSyncTransferVectorsTest \
            --required-suite com.mediahub.core.common.sync.SourceSyncTransferRoundTripTest \
            --required-suite com.mediahub.core.common.sync.SourceSyncTransferLoopbackTest \
            --required-suite com.mediahub.core.common.sync.SourceSyncTransferAuthTest \
            --required-suite com.mediahub.core.common.sync.SourceSyncTlsTest \
            --required-suite com.mediahub.core.common.sync.SourceSyncTransferListenerTest \
            --required-suite com.mediahub.core.common.sync.SourceSyncDeliveryTest \
            --required-suite com.mediahub.feature.settings.sync.SourceSyncSendLauncherTest \
            --required-suite com.mediahub.core.common.sync.SourceSyncReceiptTest \
            --required-suite com.mediahub.core.common.sync.SourceSyncHostAddressTest \
            --required-suite com.mediahub.feature.settings.sync.SourceSyncListenerControllerTest \
            --required-suite com.mediahub.core.common.sync.SourceSyncTransferClientHostTest \
            --required-suite com.mediahub.core.common.sync.SourceSyncTransferMatrixTest \
            --required-suite com.mediahub.core.common.sync.SourceSyncTransferCancelTest \
            --required-suite com.mediahub.feature.settings.sync.SourceSyncReceiveLauncherTest \
            --required-suite com.mediahub.feature.settings.pairing.PairingLinkControllerTest \
            --require-complete-suites

      - name: Lint
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: ./gradlew lintDebug --no-daemon

      # Preserve failures as well as passes; this does not retry or change any gate.
      - name: Upload validation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-validation-${{ github.sha }}
          path: |
            ci-validation/revision.json
            **/build/test-results/**/TEST-*.xml
            **/build/reports/lint-results-debug.xml
            **/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 30

      - name: Enforce visual instrumentation gate
        if: ${{ !cancelled() }}
        env:
          VISUAL_RESULT: ${{ needs.visual-instrumentation.result }}
        run: |
          printf 'Visual instrumentation matrix: %s\n' "$VISUAL_RESULT"
          test "$VISUAL_RESULT" = success

      - name: Upload build and test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, Node 24
        with:
          name: build-evidence-${{ env.EXPECTED_HEAD }}
          retention-days: 14
          path: |
            ci-evidence/
            **/build/test-results/**/*.xml
            **/build/reports/tests/
            **/build/reports/lint-results-debug.*
            app/build/outputs/apk/debug/*.apk

  visual-instrumentation:
    name: visual-instrumentation (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 32 验证无 RuntimeShader 的真实降级；36 验证 AGSL 编译、uniform 和绘制。
        api-level: [32, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p ci-evidence
          printf 'head=%s\nbase=%s\nevent_sha=%s\n' "$EXPECTED_HEAD" "$PR_BASE" "$GITHUB_SHA" | tee ci-evidence/revision.txt

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        # 与 build 保持同一个 v5/basic-cache 边界，不引入 enhanced caching。
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        # 同 build job：'tools' 包已不存在，显式只装 platform-tools。
        with:
          packages: platform-tools

      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Compile visual instrumentation APKs
        timeout-minutes: 15
        run: >-
          ./gradlew :core:ui:assembleDebugAndroidTest
          :feature:player:assembleDebugAndroidTest
          :feature:settings:assembleDebugAndroidTest
          :provider:webdav:assembleDebugAndroidTest
          :core:database:assembleDebugAndroidTest
          --no-daemon --continue --max-workers=2

      - name: Test instrumentation evidence gate
        run: python3 -m unittest discover -s .github/scripts/tests -v

      - name: Remove reports from earlier executions
        run: |
          python3 - <<'PY'
          import pathlib, shutil
          for module in ('core/ui', 'feature/player', 'feature/settings', 'provider/webdav', 'core/database'):
              shutil.rmtree(pathlib.Path(module) / 'build/outputs/androidTest-results/connected', ignore_errors=True)
          pathlib.Path('ci-evidence/instrumentation-manifest.json').unlink(missing_ok=True)
          PY
          python3 .github/scripts/verify-visual-tests.py --begin --report-timezone UTC --api "${{ matrix.api-level }}" --sha "$EXPECTED_HEAD" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

      - name: Enable KVM
        timeout-minutes: 2
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # trigger queues an asynchronous udev event. Do not race its permission update.
          sudo udevadm settle --timeout=30
          id
          stat -c '%A %U %G %t:%T %n' /dev/kvm
          test -c /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Run production visual paths on emulator
        timeout-minutes: 20
        # v2.37.0 uses Node 24 + build-tools 36, matching this project's compile SDK.
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          disable-linux-hw-accel: false
          disable-animations: false
          # Android hardware-accelerated Canvas runs via the emulated GPU. This is
          # not OEM GPU/audio acceptance. swiftshader_indirect is deprecated.
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none
          # One device: serialize module instrumentation so activities cannot steal focus.
          script: bash .github/scripts/run-visual-validation.sh "${{ matrix.api-level }}"

      - name: Require executed visual assertions
        if: ${{ !cancelled() }}
        env:
          VISUAL_API: ${{ matrix.api-level }}
        run: python3 .github/scripts/verify-visual-tests.py --api "$VISUAL_API" --sha "$EXPECTED_HEAD" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload emulator test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, Node 24
        with:
          name: visual-api-${{ matrix.api-level }}-${{ env.EXPECTED_HEAD }}
          retention-days: 14
          path: |
            ci-evidence/
            core/ui/build/outputs/androidTest-results/
            core/ui/build/reports/androidTests/
            feature/player/build/outputs/androidTest-results/
            feature/player/build/reports/androidTests/
            feature/settings/build/outputs/androidTest-results/
            feature/settings/build/reports/androidTests/
            provider/webdav/build/outputs/androidTest-results/
            provider/webdav/build/reports/androidTests/
            core/database/build/outputs/androidTest-results/
            core/database/build/reports/androidTests/
