name: Sync utility safety

on:
  pull_request:
    paths:
      - 'scripts/github-nightly-sync.ps1'
      - 'scripts/tests/test_github_sync_safety.py'
      - 'scripts/tests/test_github_sync_merged_abilities.py'
      - '.github/workflows/sync-utility-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-git-fixtures:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record exact revision
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_HEAD) { throw 'Wrong checkout' }
          New-Item -ItemType Directory -Force utility-evidence | Out-Null
          $actual | Set-Content -Encoding utf8 utility-evidence/revision.txt
      - name: Verify disposable Git fixtures
        shell: pwsh
        run: |
          python -X utf8 -m unittest discover -s scripts/tests -p "test_github_sync*.py" -v *> utility-evidence/tests.log
          $result = $LASTEXITCODE
          Get-Content utility-evidence/tests.log
          exit $result
      - name: Verify injected runner seam
        shell: pwsh
        run: |
          Start-Transcript -Path utility-evidence/pester.log | Out-Null
          try {
            Import-Module Pester -MinimumVersion 3.4.0 -ErrorAction Stop
            $suite = 'scripts/tests/github-nightly-sync.injection.Tests.ps1'
            if ((Get-Command Invoke-Pester).Parameters.ContainsKey('Path')) {
              $run = Invoke-Pester -Path $suite -PassThru
            } else {
              $run = Invoke-Pester -Script $suite -PassThru
            }
            "Pester passed=$($run.PassedCount) failed=$($run.FailedCount)"
            if ($run.FailedCount -gt 0) { exit 1 }
          } finally {
            Stop-Transcript | Out-Null
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-utility-safety
          path: utility-evidence/
