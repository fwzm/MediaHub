name: windows-ci

# The Windows client is built and tested independently of the Android pipeline. This workflow is
# scoped to windows/** so a Windows-only change cannot fail or delay Android verification, and an
# Android-only change never spends Windows runner minutes.
on:
  push:
    branches: ["feature/windows-*", "windows/**"]
    paths: ["windows/**", ".github/workflows/windows-ci.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  LIBMPV_DIR: ${{ github.workspace }}\windows\native\libmpv

jobs:
  build-test:
    name: build / unit tests / packaging
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache libmpv
        id: libmpv-cache
        uses: actions/cache@v4
        with:
          path: windows/native/libmpv
          key: libmpv-20261014-ec38361c56-win-x64

      - name: Fetch libmpv
        if: steps.libmpv-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./windows/tools/fetch-libmpv.ps1

      - name: Verify libmpv is present
        shell: pwsh
        run: |
          $dll = Join-Path $env:LIBMPV_DIR "libmpv-2.dll"
          if (-not (Test-Path $dll)) { throw "libmpv-2.dll missing at $dll" }
          "libmpv bytes: " + (Get-Item $dll).Length

      - name: Restore
        working-directory: windows
        run: dotnet restore MediaHub.Windows.sln

      - name: Build (Debug)
        working-directory: windows
        run: dotnet build MediaHub.Windows.sln -c Debug -p:Platform=x64 --no-restore

      - name: Unit and contract tests
        working-directory: windows
        run: >
          dotnet test tests/MediaHub.Tests/MediaHub.Tests.csproj
          -c Debug -p:Platform=x64 --no-build
          --logger "trx;LogFileName=windows-tests.trx"
          --results-directory ./artifacts/test-results

      - name: Fail if no test results were produced
        shell: pwsh
        working-directory: windows
        run: |
          # A test step that silently runs zero tests would otherwise be reported as success.
          $files = Get-ChildItem ./artifacts/test-results -Filter *.trx -ErrorAction SilentlyContinue
          if (-not $files) { throw "no .trx produced: the test run executed nothing" }
          $xml = [xml](Get-Content $files[0].FullName -Raw)
          $total = [int]$xml.TestRun.ResultSummary.Counters.total
          $failed = [int]$xml.TestRun.ResultSummary.Counters.failed
          "tests total=$total failed=$failed"
          if ($total -lt 50) { throw "expected at least 50 tests, got $total" }
          if ($failed -ne 0) { throw "$failed test(s) failed" }

      - name: Portable publish (Release)
        working-directory: windows
        run: >
          dotnet publish src/MediaHub.App/MediaHub.App.csproj
          -c Release -p:Platform=x64
          -o ./artifacts/portable

      - name: Smoke-check the published output
        shell: pwsh
        working-directory: windows
        run: |
          # The published folder must be self-contained: an exe, the engine DLL and the app dll.
          $required = @("MediaHub.exe", "libmpv-2.dll", "MediaHub.dll", "MediaHub.Net.dll", "MediaHub.Providers.dll")
          $missing = $required | Where-Object { -not (Test-Path (Join-Path "./artifacts/portable" $_)) }
          if ($missing) { throw "missing from publish output: " + ($missing -join ", ") }
          "portable output size: " + [math]::Round((Get-ChildItem ./artifacts/portable -Recurse | Measure-Object Length -Sum).Sum / 1MB, 1) + " MB"

      - name: Engine integration probe
        shell: pwsh
        working-directory: windows
        env:
          # A hosted runner has no GPU and no desktop, so the probe runs with the decoder exercised
          # and the presentation path disabled. The same assertions still apply: duration reported,
          # position advancing, seek landing, pause holding, tracks enumerated.
          MEDIAHUB_MPV_VO: "null"
          MEDIAHUB_MPV_HWDEC: "no"
        run: |
          # Native stderr would otherwise become a terminating error under the runner's
          # ErrorActionPreference, which is what made this step fail on the first CI run.
          $ErrorActionPreference = "Continue"

          $exe = "./tools/MpvProbe/bin/x64/Debug/net10.0-windows/win-x64/MpvProbe.exe"
          if (-not (Test-Path $exe)) { throw "MpvProbe was not built" }

          $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if (-not $ffmpeg) {
            $usage = & $exe 2>&1 | Out-String
            "probe usage output: $usage"
            if ($LASTEXITCODE -eq 0) { throw "probe should fail without a media file" }
            "MPV_PROBE_USAGE_CONTRACT OK"
            "WARNING: ffmpeg is unavailable on this runner, so real playback was NOT exercised."
            "         Recorded as DEVICE_UNVERIFIED, not as a pass."
            exit 0
          }

          $sample = Join-Path $env:RUNNER_TEMP "mediahub-ci-sample.mp4"
          $ffArgs = @(
            "-y", "-hide_banner", "-loglevel", "error",
            "-f", "lavfi", "-i", "testsrc2=size=320x240:rate=15:duration=6",
            "-f", "lavfi", "-i", "sine=frequency=440:duration=6",
            "-c:v", "libx264", "-preset", "veryfast", "-pix_fmt", "yuv420p",
            "-c:a", "aac", "-ac", "2", "-shortest", $sample
          )
          & ffmpeg @ffArgs
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $sample)) { throw "ffmpeg could not generate a CI sample" }
          "CI sample: " + (Get-Item $sample).Length + " bytes"

          $output = & $exe $sample 4 2>&1 | Out-String
          $output.Split([Environment]::NewLine) | Where-Object { $_ -match "^(vo=|engine:|media :|RESULT|MPV_PROBE|  t=)" } | ForEach-Object { $_ }
          if ($LASTEXITCODE -ne 0) { throw "MPV_PROBE FAILED: the engine did not meet its assertions" }
          "MPV_PROBE PASS in CI (decoder and clock asserted; presentation path NOT exercised -> GPU/HDR UNVERIFIED)"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediahub-windows-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            windows/artifacts/test-results/**
            windows/artifacts/portable/**