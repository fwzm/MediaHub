# MediaHub Windows — engine key map.
#
# Loaded with --input-default-bindings=no so the surface only reacts to what is listed here.
# Host-level actions (fullscreen, next episode, opening panels) are intentionally absent: they are
# owned by the XAML chrome, because the engine cannot resize the MediaHub window and a
# `cycle fullscreen` binding would fullscreen the embedded child window instead of the app.
#
# Mouse bindings are safe to keep here: the host only *observes* pointer movement (to reveal the
# control bar) and never synthesises clicks, so there is exactly one owner per gesture.

MBTN_LEFT       cycle pause
MBTN_LEFT_DBL   cycle pause
MBTN_RIGHT      cycle pause
WHEEL_UP        add volume 5
WHEEL_DOWN      add volume -5

SPACE           cycle pause
LEFT            seek -5
RIGHT           seek 5
SHIFT+LEFT      seek -30
SHIFT+RIGHT     seek 30
UP              add volume 5
DOWN            add volume -5
m               cycle mute
n               cycle sub-visibility
# Audio/subtitle track cycling stays in the engine so it keeps working while the video window has
# focus; the XAML panel reflects the result through property observation.
j               cycle sub
#               cycle audio
